<div
  class="bg-white rounded-lg shadow-md hover:shadow-lg transition-all duration-300 py-10 px-5 lg:px-16 h-80"
>
  <div class="w-20 bg-[#d5f5f6] rounded-full p-3 mx-auto">
    <img [src]="icon()" [alt]="title()" />
  </div>
  <h3 class="text-xl font-semibold text-center mt-5">{{ title() }}</h3>
  <p class="text-lg text-gray-600 mt-5 text-center">
    {{ description() }}
  </p>
</div>
